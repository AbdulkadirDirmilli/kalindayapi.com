services:
  kalindayapi:
    build:
      context: .
      # Build adimlari da host aginda calismali. VPS'in netif sinirinde
      # (Virtuozzo) her RUN adimi icin veth cifti acilamiyor ve build
      # "cannot allocate memory" ile patliyor. network_mode: host yalnizca
      # calisan konteyneri kurtariyordu, build'i degil.
      network: host
    container_name: kalindayapi-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3001
      - HOSTNAME=0.0.0.0
    volumes:
      - ./prisma/dev.db:/app/prisma/dev.db
      - ./public/uploads:/app/public/uploads
    # host ağı: veth gerektirmez (VPS netif_max_nr sınırı); nginx 172.18.0.1:3001'e gider
    network_mode: host
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3001"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

